spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quickbite_order_db}
    username: ${DB_USERNAME:quickbite_order}
    password: ${DB_PASSWORD:quickbite_order}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}

feign:
  client:
    config:
      user-service:
        url: ${FEIGN_CLIENT_CONFIG_USER_SERVICE_URL:http://user-service:8081}
      restaurant-service:
        url: ${FEIGN_CLIENT_CONFIG_RESTAURANT_SERVICE_URL:http://restaurant-service:8082}
      notification-service:
        url: ${FEIGN_CLIENT_CONFIG_NOTIFICATION_SERVICE_URL:http://notification-service:8084}
